<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="icon" href="data:,"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Summary</title><style>
:root{--bg:#0f1115;--card:#161a22;--tile:#1b2029;--line:#242a36;--text:#eef0f5;--muted:#8d95a8;--red:#ff5c6c;--green:#3ddc84;--purple:#a78bfa;--yellow:#ffd166;--blue:#4c8dff;--orange:#ff8c42;--gray:#9aa3b5;--self:#d5dbe8}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:var(--bg);color:var(--text);font:14px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}.wrap{height:130px;width:100%;max-width:900px;margin:auto;padding:10px 12px;display:flex;flex-direction:column;gap:6px}.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;min-height:0;flex:1}.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:9px 12px;min-width:0;display:flex;flex-direction:column;justify-content:center}.label{color:var(--muted);font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.value{color:var(--yellow);font-size:32px;font-weight:800;line-height:1.08;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}.value.text{color:var(--text);font-size:14px;line-height:1.2;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}.hint{color:var(--muted);font-size:12px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.notice{color:var(--muted);font-size:12px;min-height:14px}@media(max-width:600px){.wrap{padding:6px 8px}.tile{padding:7px 9px}.value{font-size:28px}.label{font-size:12px}.hint{font-size:12px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style></head><body><main class="wrap"><div id="tiles" class="tiles"></div><div id="notice" class="notice" hidden></div></main><script>
function loadState(defaults){var q=new URLSearchParams(location.search),src=q.get('src')||'data/state.json';return fetch(src,{cache:'no-store'}).then(function(res){if(!res.ok)throw new Error(String(res.status));return res.json()}).then(function(json){return {data:json,source:'state',updatedAt:json.updatedAt||null}}).catch(function(){return {data:defaults,source:'example',updatedAt:null}})}
var examples={schemaVersion:2,account:{balance:null,goal:500,start:15,rungs:[15,35,75,155,315,500]},ladder:[],session:{tradesTaken:0,losses:0,maxTrades:2,maxLosses:2},cleanTrades:{target:10,seq:[]},streak:{current:0},paths:{trading:{milestones:[{id:'example',title:'Example milestone',weight:1,done:false}],nextSteps:['Add milestones to state.json']}},pages:{start:{title:'Example page',path:'trading',kpis:['balance','streak','nextStep']}}};
function ref(data,slug){var p=data.pages&&data.pages[slug]||null,id=p&&p.path==='all'?((data.focus&&data.focus.path)||'trading'):(p&&p.path);return {page:p,path:(data.paths&&data.paths[id])||null}}
function stats(path){var ms=path&&path.milestones||[],total=ms.reduce(function(a,m){return a+(+m.weight||0)},0),done=ms.reduce(function(a,m){return a+(m.done?(+m.weight||0):0)},0);return {total:total,done:done,pct:total?Math.round(done/total*100):0}}
function balanceFor(data,q){if(q.has('balance')){var n=Number(q.get('balance'));return Number.isFinite(n)?n:null}return data.account&&typeof data.account.balance==='number'?data.account.balance:null}
function money(n){return '$'+(Number.isInteger(n)?n:n.toFixed(2))}
function metric(key,data,path,q){var acc=data.account||{},sess=data.session||{},ct=data.cleanTrades||{target:10,seq:[]},st=data.streak||{},s=stats(path),bal=balanceFor(data,q);if(key==='balance')return bal===null?['—','no data yet']:[money(bal),'of '+money(acc.goal||500)];if(key==='nextRung'){var r=(acc.rungs||[]).find(function(v){return bal!==null&&v>bal});return r==null?['—','no data yet']:[money(r),money(r-(bal||0))+' to go']}if(key==='lot'){var rows=data.ladder||[],row=rows.filter(function(x){return bal!==null&&x.balance<=bal}).pop();return row?[String(row.lot),'current lot']:['—','no data yet']}if(key==='cleanTrades'){var seq=Array.isArray(ct.seq)?ct.seq:[],n=seq.filter(Boolean).length;return [n+'/'+(ct.target||10),'clean trades']}if(key==='tradesLeft'){var max=Number(sess.maxTrades),left=Math.max(0,max-(Number(sess.tradesTaken)||0));return [Number(sess.losses)>=Number(sess.maxLosses)?'Done':String(left),Number(sess.losses)>=Number(sess.maxLosses)?'for the session':'trades left (max '+max+')']}if(key==='streak'){var n=Number(st.current)||0;return [String(n),n?'day streak':'start today']}if(key==='milestonesDone'){return [s.done+'/'+s.total,'milestones']}if(key==='nextStep'){var step=path&&path.nextSteps&&path.nextSteps[0];return [step||'—',step?'next step':'no data yet']}return ['—','no data yet']}
function render(res){var q=new URLSearchParams(location.search),slug=q.get('page')||'start',r=ref(res.data,slug),keys=r.page&&Array.isArray(r.page.kpis)?r.page.kpis:['balance','streak','nextStep'];document.title=(r.page&&r.page.title||slug)+' · Summary';document.getElementById('tiles').innerHTML=keys.slice(0,3).map(function(k){var x=metric(k,res.data,r.path,q),text=k==='nextStep';return '<article class="tile"><div class="label">'+k.replace(/[A-Z]/g,function(c){return ' '+c}).toUpperCase()+'</div><div class="value'+(text?' text':'')+'">'+String(x[0]).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})+'</div><div class="hint">'+x[1]+'</div></article>'}).join('');if(res.source==='example'){var n=document.getElementById('notice');n.hidden=false;n.textContent='Data unavailable. Showing example.'}}
loadState(examples).then(render);
</script></body></html>
