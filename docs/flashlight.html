<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="icon" href="data:,"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Flashlight</title><style>
:root{--bg:#0f1115;--card:#161a22;--tile:#1b2029;--line:#242a36;--text:#eef0f5;--muted:#8d95a8;--red:#ff5c6c;--green:#3ddc84;--purple:#a78bfa;--yellow:#ffd166;--blue:#4c8dff;--orange:#ff8c42;--gray:#9aa3b5;--self:#d5dbe8;--ease:cubic-bezier(.22,.8,.25,1)}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:var(--bg);color:var(--text);font:14px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}.stage{height:440px;width:100%;max-width:1000px;margin:auto;position:relative;background:var(--bg);overflow:hidden}.stage svg{display:block;width:100%;height:420px}.kicker{position:absolute;left:16px;top:12px;color:var(--muted);font-size:12px;letter-spacing:.14em;text-transform:uppercase}.now-label{position:absolute;left:52%;top:141px;max-width:44%;pointer-events:none}.now-label strong{display:block;font-size:16px;line-height:1.2}.now-label span{display:block;color:var(--muted);font-size:13px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.path-links{position:absolute;left:14px;right:14px;bottom:8px;display:flex;gap:6px;flex-wrap:wrap}.path-links a{min-height:32px;padding:7px 9px;border:1px solid color-mix(in srgb,var(--path-color) 50%,var(--line));border-radius:999px;background:color-mix(in srgb,var(--path-color) 8%,var(--card));color:var(--text);font-size:12px;text-decoration:none}.path-links a:hover,.path-links a:focus-visible{outline:2px solid var(--path-color);outline-offset:1px}.tooltip{position:absolute;z-index:2;left:50%;top:205px;transform:translateX(-50%);width:min(320px,calc(100% - 28px));background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;box-shadow:0 12px 30px #0008}.tooltip[hidden]{display:none}.tooltip b{display:block;font-size:14px}.tooltip p{color:var(--muted);margin:4px 0 10px;font-size:13px}.tooltip a{display:inline-flex;align-items:center;min-height:44px;color:var(--text);font-weight:700}.empty{fill:var(--muted);opacity:.55}.beam{transition:opacity 1.6s var(--ease),filter 1.6s var(--ease)}.now-dot{cursor:pointer;outline:none;transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-in-out infinite}.now-dot:focus circle{stroke:var(--text);stroke-width:3}@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}@media(max-width:600px){.now-label{left:43%;max-width:53%;top:143px}.kicker{left:12px}.path-links{left:10px;right:10px}.tooltip{top:205px}}@media(prefers-reduced-motion:reduce){.now-dot{animation:none}.beam{transition:none}}
</style></head><body><main id="stage" class="stage"><div id="kicker" class="kicker">Flashlight</div><svg id="scene" viewBox="0 0 1000 420" role="img" aria-label="Journey flashlight"><defs><linearGradient id="beamGradient" x1="0" x2="0" y1="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity=".18"/><stop offset="1" stop-color="#fff" stop-opacity=".55"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="12" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="soft"><feGaussianBlur stdDeviation="24"/></filter></defs><g id="beam" class="beam"></g><g id="trail"></g><g id="nodes"></g><g id="now" class="now-dot" tabindex="0" role="button" aria-label="Current milestone"></g></svg><div id="nowLabel" class="now-label"><strong>Loading…</strong><span></span></div><nav id="paths" class="path-links" aria-label="Paths"></nav><section id="tooltip" class="tooltip" hidden><b></b><p></p><a target="_blank" rel="noopener">Open in Notion ↗</a></section></main><script>
function loadState(defaults){var q=new URLSearchParams(location.search),src=q.get('src')||'data/state.json';return fetch(src,{cache:'no-store'}).then(function(res){if(!res.ok)throw new Error(String(res.status));return res.json()}).then(function(json){return {data:json,source:'state',updatedAt:json.updatedAt||null}}).catch(function(){return {data:defaults,source:'example',updatedAt:null}})}
var COLORS={red:'#ff5c6c',green:'#3ddc84',purple:'#a78bfa',yellow:'#ffd166',blue:'#4c8dff',orange:'#ff8c42',gray:'#9aa3b5',self:'#d5dbe8','red-yellow':'#ff5c6c'};
var examples={schemaVersion:2,focus:{path:'trading'},paths:{trading:{title:'Trading',icon:'📈',color:'red',finishLine:'Example finish line',link:null,nextSteps:['Add milestones to state.json'],milestones:[{id:'example',title:'Example milestone',weight:1,done:false}]}},pages:{}};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function pct(path){var ms=path&&path.milestones||[],total=ms.reduce(function(a,m){return a+(+m.weight||0)},0),done=ms.reduce(function(a,m){return a+(m.done?(+m.weight||0):0)},0);return {ms:ms,total:total,done:done,p:total?done/total:0}}
function choose(data,requested){var paths=data.paths||{},id=requested==='all'?((data.focus&&data.focus.path)||'trading'):requested;if(requested==='all'&&(!paths[id]||!(paths[id].milestones||[]).some(function(m){return !m.done}))){id=Object.keys(paths).find(function(k){return (paths[k].milestones||[]).some(function(m){return !m.done})})||id}return {id:id,path:paths[id]||{title:id,icon:'◌',color:'blue',finishLine:null,nextSteps:[],milestones:[]}}}
function el(tag,attrs,parent){var n=document.createElementNS('http://www.w3.org/2000/svg',tag);Object.keys(attrs||{}).forEach(function(k){n.setAttribute(k,attrs[k])});if(parent)parent.appendChild(n);return n}
function text(parent,x,y,value,attrs){var n=el('text',{x:x,y:y,fill:'#8d95a8','font-size':'12','font-family':'system-ui, sans-serif',...(attrs||{})},parent);n.textContent=value;return n}
function render(res){var q=new URLSearchParams(location.search),requested=(q.get('path')||'all').toLowerCase(),chosen=choose(res.data,requested),path=chosen.path,stats=pct(path),ms=stats.ms,nowIndex=ms.findIndex(function(m){return !m.done}),now=nowIndex<0?null:ms[nowIndex],color=COLORS[path.color]||COLORS.blue,svg=document.getElementById('scene'),beam=document.getElementById('beam'),nodes=document.getElementById('nodes'),trail=document.getElementById('trail'),nowGroup=document.getElementById('now');document.title=(path.title||'Flashlight')+' · Journey';document.getElementById('kicker').textContent=(requested==='all'?'All paths':path.title)+' · '+Math.round(stats.p*100)+'%';var topY=160,bottom=420,beamLen=60+(bottom-topY)*stats.p,beamTop=bottom-beamLen,baseW=280,topW=34;beam.innerHTML='';el('polygon',{points:(500-baseW/2)+','+bottom+' '+(500+baseW/2)+','+bottom+' '+(500+topW/2)+','+beamTop+' '+(500-topW/2)+','+beamTop,fill:'url(#beamGradient)',opacity:String(.18+.37*stats.p)},beam);el('ellipse',{cx:500,cy:bottom-10,rx:baseW/2,ry:32,fill:color,opacity:String(.035+.08*stats.p),filter:'url(#soft)'},beam);nodes.innerHTML='';trail.innerHTML='';var done=ms.filter(function(m){return m.done}),last3=done.slice(-3);done.forEach(function(m,i){var idx=ms.indexOf(m),y=bottom-(bottom-topY)*((idx+1)/Math.max(ms.length,1)),dot=el('circle',{cx:500,cy:y,r:6,fill:color,opacity:.8},nodes);dot.setAttribute('aria-label',m.title);if(last3.indexOf(m)>=0){text(nodes,514,y+4,m.title,{fill:'#eef0f5','font-size':'12'})}});if(done.length>3){el('path',{d:'M500 '+(bottom-(bottom-topY)*((ms.indexOf(done[0])+1)/Math.max(ms.length,1)))+' L500 '+(bottom-(bottom-topY)*((ms.indexOf(done[done.length-4])+1)/Math.max(ms.length,1))),stroke:color,'stroke-width':3,opacity:.45,filter:'url(#glow)'},trail);text(trail,514,Math.min(395,bottom-(bottom-topY)*((ms.indexOf(done[done.length-4])+1)/Math.max(ms.length,1))+20),'+'+(done.length-3)+' done',{fill:color})}var upcoming=nowIndex<0?[]:ms.slice(nowIndex+1).filter(function(m){return !m.done}),nextDetail=upcoming.slice(0,2);nextDetail.forEach(function(m,i){var y=topY-34-i*34;el('circle',{cx:500,cy:y,r:5,fill:color,opacity:i?'.25':'.45'},nodes);text(nodes,514,y+4,m.title,{fill:'#8d95a8'})});if(upcoming.length>2)text(nodes,514,topY-98,'+'+(upcoming.length-2)+' ahead',{fill:'#8d95a8'});nowGroup.innerHTML='';var core=el('circle',{cx:500,cy:topY,r:28,fill:'#fff7c4',opacity:.95,filter:'url(#glow)'},nowGroup);el('circle',{cx:500,cy:topY,r:10,fill:'#fff'},nowGroup);nowGroup.style.color=color;document.getElementById('nowLabel').querySelector('strong').textContent=now?now.title:(ms.length?'All done. Pick the next path.':'No milestones yet');document.getElementById('nowLabel').querySelector('span').textContent=now&&path.nextSteps&&path.nextSteps[0]?'next: '+path.nextSteps[0]:(path.finishLine||'(Ndegwa\'s words)');nowGroup.setAttribute('aria-label',now?now.title:'No milestones yet');document.getElementById('tooltip').hidden=true;var tip=document.getElementById('tooltip');tip.querySelector('b').textContent=now?now.title:'No milestones yet';tip.querySelector('p').textContent=now&&path.nextSteps&&path.nextSteps[0]?'Next: '+path.nextSteps[0]:(path.finishLine||'(Ndegwa\'s words)');var link=tip.querySelector('a');if(path.link){link.href=path.link;link.hidden=false}else{link.hidden=true}function toggle(){tip.hidden=!tip.hidden}nowGroup.onclick=toggle;nowGroup.onkeydown=function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle()}};var nav=document.getElementById('paths');nav.innerHTML='';if(requested==='all'){Object.keys(res.data.paths||{}).forEach(function(id){var p=res.data.paths[id],s=pct(p),a=document.createElement('a');a.href='?path='+encodeURIComponent(id);a.style.setProperty('--path-color',COLORS[p.color]||COLORS.blue);a.textContent=(p.title||id)+' '+Math.round(s.p*100)+'%';nav.appendChild(a)})}else{nav.innerHTML='<a href="?path=all">All paths</a>'}try{var key='flashlight-progress:'+chosen.id,old=sessionStorage.getItem(key);sessionStorage.setItem(key,String(stats.p));if(old!==null&&Number(old)!==stats.p){nowGroup.style.transition='transform 1.6s cubic-bezier(.22,.8,.25,1)';nowGroup.style.transform='scale(.96)';requestAnimationFrame(function(){nowGroup.style.transform='scale(1)'})}}catch(e){/* storage can be unavailable in private embeds */}if(res.source==='example'){var n=document.createElement('div');n.textContent='Data unavailable. Showing example.';n.style.cssText='position:absolute;right:14px;top:12px;color:#8d95a8;font-size:12px';document.getElementById('stage').appendChild(n)}}
loadState(examples).then(render);
</script></body></html>
