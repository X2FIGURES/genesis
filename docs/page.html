<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><link rel="icon" href="data:,"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Life page</title>
<style>
:root{--bg:#0f1115;--card:#161a22;--tile:#1b2029;--line:#242a36;--text:#eef0f5;--muted:#8d95a8;--red:#ff5c6c;--green:#3ddc84;--purple:#a78bfa;--yellow:#ffd166;--blue:#4c8dff;--orange:#ff8c42;--gray:#9aa3b5;--self:#d5dbe8;--ease:cubic-bezier(.22,.8,.25,1)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:var(--bg);color:var(--text);font:14px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:0}.card{height:190px;width:100%;max-width:900px;margin:auto;padding:16px;border:1px solid var(--line);border-left:4px solid var(--accent,var(--blue));border-radius:16px;background:var(--card);display:grid;grid-template-columns:minmax(0,1.1fr) minmax(160px,.9fr) minmax(170px,1fr);grid-template-rows:1fr auto;gap:10px 18px;position:relative}.left,.middle,.right{min-width:0}.left{display:flex;gap:10px;align-items:flex-start}.icon{font-size:40px;line-height:1}.title{font-size:22px;font-weight:800;line-height:1.1;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.finish{color:var(--muted);margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.middle{display:flex;flex-direction:column;justify-content:center}.bar{height:10px;background:var(--line);border-radius:999px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--accent,var(--blue));border-radius:inherit;transition:width .6s var(--ease)}.percent{font-size:28px;font-weight:800;color:var(--yellow);margin-top:5px;font-variant-numeric:tabular-nums}.count{color:var(--muted);font-size:12px}.right{display:flex;align-items:center}.now{border:1px solid var(--accent,var(--blue));background:var(--tile);border-radius:999px;padding:9px 12px;max-width:100%;min-height:44px;display:flex;flex-direction:column;justify-content:center;overflow:hidden}.now b{font-size:12px;letter-spacing:.08em;color:var(--accent,var(--blue))}.now span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}.now small{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.footer{grid-column:1/-1;color:var(--muted);font-size:12px;align-self:end}.notice{position:absolute;right:16px;bottom:16px;color:var(--muted);font-size:12px}.pulse{animation:pulse 1.2s ease-out 1}@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 40%,transparent)}100%{box-shadow:0 0 0 10px transparent}}@media(max-width:600px){.card{grid-template-columns:1fr;grid-template-rows:auto auto auto auto;height:190px;padding:12px;gap:5px 0}.icon{font-size:30px}.title{font-size:19px}.finish{margin-top:3px}.middle{display:grid;grid-template-columns:1fr auto;align-items:center;column-gap:10px}.bar{grid-column:1/-1}.percent{margin:0;font-size:26px}.right{min-height:44px}.now{width:100%;padding:6px 10px}.footer{font-size:12px}.notice{right:12px;bottom:12px}}
@media(prefers-reduced-motion:reduce){.bar i,.pulse{transition:none;animation:none}}
</style>
</head>
<body>
<main id="card" class="card" aria-live="polite"><section class="left"><div id="icon" class="icon">◌</div><div><div id="title" class="title">Loading…</div><div id="finish" class="finish">Loading…</div></div></section><section class="middle"><div class="bar" aria-label="Progress"><i id="fill"></i></div><div id="percent" class="percent">0%</div><div id="count" class="count">0 of 0 milestones</div></section><section class="right"><div id="now" class="now"><b>NOW</b><span>Loading…</span><small></small></div></section><div id="footer" class="footer">Updated —</div><div id="notice" class="notice" hidden></div></main>
<script>
function loadState(defaults){var q=new URLSearchParams(location.search),src=q.get('src')||'data/state.json';return fetch(src,{cache:'no-store'}).then(function(res){if(!res.ok)throw new Error(String(res.status));return res.json()}).then(function(json){return {data:json,source:'state',updatedAt:json.updatedAt||null}}).catch(function(){return {data:defaults,source:'example',updatedAt:null}})}
var colors={red:'var(--red)',green:'var(--green)',purple:'var(--purple)',yellow:'var(--yellow)',blue:'var(--blue)',orange:'var(--orange)',gray:'var(--gray)',self:'var(--self)','red-yellow':'var(--red)'};
var examples={schemaVersion:2,updatedAt:null,focus:{path:'trading'},paths:{trading:{title:'Trading',icon:'📈',color:'red',finishLine:'Example finish line',nextSteps:['Add milestones to state.json'],milestones:[{id:'example',title:'Example milestone',weight:1,done:false}]}},pages:{start:{title:'Example page',path:'trading'}}};
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function pathFor(data,slug){var p=(data.pages&&data.pages[slug])||null;var pathId=p&&p.path==='all'?((data.focus&&data.focus.path)||'trading'):(p&&p.path);return {page:p,pathId:pathId,path:(data.paths&&data.paths[pathId])||null}}
function progress(path){var ms=(path&&path.milestones)||[],total=ms.reduce(function(a,m){return a+(Number(m.weight)>0?Number(m.weight):0)},0),done=ms.reduce(function(a,m){return a+(m.done&&Number(m.weight)>0?Number(m.weight):0)},0);return {ms:ms,total:total,done:done,pct:total?Math.round(done/total*100):0}}
function render(res){var q=new URLSearchParams(location.search),slug=q.get('page')||'start',ref=pathFor(res.data,slug),data=res.data,page=ref.page,path=ref.path||{title:'Not set up yet',icon:'?',color:'blue',finishLine:null,nextSteps:[],milestones:[]};var stats=progress(path),now=stats.ms.find(function(m){return !m.done});document.title=(page&&page.title||slug)+' · Life system';document.getElementById('card').style.setProperty('--accent',colors[path.color]||'var(--blue)');document.getElementById('icon').textContent=page?path.icon||'◌':'?';document.getElementById('title').textContent=page?page.title:slug;document.getElementById('finish').textContent=page?(path.finishLine||'(Ndegwa\'s words)'):'Not set up yet. Add it to state.json.';document.getElementById('fill').style.width=stats.pct+'%';document.getElementById('percent').textContent=stats.pct+'%';document.getElementById('count').textContent=stats.done+' of '+stats.total+' milestones';var n=document.getElementById('now');n.querySelector('span').textContent=now?now.title:(stats.ms.length?'All done':'No milestones yet');n.querySelector('small').textContent=now&&path.nextSteps&&path.nextSteps[0]?'next: '+path.nextSteps[0]:(stats.ms.length?'Pick the next path':path.finishLine||'(Ndegwa\'s words)');document.getElementById('footer').textContent='Updated '+(res.updatedAt||'—');if(res.source==='example'){var note=document.getElementById('notice');note.hidden=false;note.textContent='Data unavailable. Showing example.'}n.classList.add('pulse');setTimeout(function(){n.classList.remove('pulse')},1300)}
loadState(examples).then(render);
</script>
</body></html>
