<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Clean trades</title>
<style>
:root{--bg:#0f1115;--card:#161a22;--tile:#1b2029;--line:#242a36;--text:#eef0f5;--muted:#8d95a8;
--blue:#4c8dff;--yellow:#ffd166;--green:#3ddc84;--red:#ff5c6c;--purple:#a78bfa}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
body{padding:8px}
.card{height:100%;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;min-height:0}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.label{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.big{font-size:clamp(22px,7vw,32px);font-weight:800;color:var(--yellow);font-variant-numeric:tabular-nums}
.streak{font-size:12px;font-weight:700;color:var(--muted)}
.streak b{color:var(--green)}
.row{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.cell{width:clamp(22px,6vw,28px);height:clamp(22px,6vw,28px);border-radius:8px;border:1px solid var(--line);background:var(--tile);opacity:.35}
.cell.clean{background:rgba(61,220,132,.35);border-color:rgba(61,220,132,.55);opacity:1}
.cell.miss{background:rgba(255,92,108,.3);border-color:rgba(255,92,108,.55);opacity:1}
.days{display:flex;gap:3px;flex-wrap:nowrap;overflow:hidden}
.day{flex:1 1 0;min-width:6px;height:10px;border-radius:3px;background:var(--tile);opacity:.25}
.day.on{opacity:1;background:rgba(61,220,132,.45)}
.foot{font-size:11px;color:var(--muted)}
@media (max-width:360px){.days{display:none}}
</style>
</head>
<body>
<div class="card" role="group" aria-label="Clean trades heat strip">
  <div class="top">
    <div class="label">Clean trades</div>
    <div class="big" id="count">0 / 10</div>
  </div>
  <div class="streak" id="streak"></div>
  <div class="row" id="cells" aria-label="Trade sequence"></div>
  <div class="days" id="days" aria-hidden="true"></div>
  <div class="foot" id="foot"></div>
</div>
<script>
(function(){
  function loadState(def){var q=new URLSearchParams(location.search),src=q.get('src')||'data/state.json';
    return fetch(src,{cache:'no-store'}).then(function(r){if(!r.ok)throw 0;return r.json();}).then(function(j){return {data:j,source:'state'};})
      .catch(function(){return {data:def,source:'example'};});}
  function streak(seq){var n=0;for(var i=seq.length-1;i>=0;i--){if(seq[i])n++;else break;}return n;}
  function parseSeq(s){if(!s)return null;return s.split('').map(function(c){return c==='1';});}
  loadState({cleanTrades:{target:10,seq:[]},days:[]}).then(function(res){
    var q=new URLSearchParams(location.search),ct=res.data.cleanTrades||{};
    var target=isFinite(parseFloat(q.get('target')))?+q.get('target'):(+ct.target||10);
    var seq=parseSeq(q.get('seq'));
    if(!seq&&Array.isArray(ct.seq))seq=ct.seq.slice();
    if(!seq)seq=[];
    var clean=seq.filter(Boolean).length;
    if(q.has('clean')&&isFinite(parseFloat(q.get('clean'))))clean=+q.get('clean');
    document.getElementById('count').textContent=clean+' / '+target+' clean';
    var st=streak(seq);
    document.getElementById('streak').innerHTML=st?'Streak: <b>'+st+'</b> clean in a row':'Streak: <b>0</b>';
    var box=document.getElementById('cells');box.textContent='';
    for(var i=0;i<target;i++){
      var d=document.createElement('div');d.className='cell';
      if(i<seq.length)d.className+=' '+(seq[i]?'clean':'miss');
      box.appendChild(d);
    }
    var daysEl=document.getElementById('days');daysEl.textContent='';
    var days=Array.isArray(res.data.days)?res.data.days.slice(-28):[];
    days.forEach(function(day){
      var el=document.createElement('div');el.className='day'+(day.clean>0?' on':'');
      el.title=day.date+' · '+day.clean+' clean';
      daysEl.appendChild(el);
    });
    var foot=document.getElementById('foot');
    if(!seq.length)foot.textContent='no trades logged yet';
    else if(res.source==='state')foot.textContent='From state.json';
    else foot.textContent='';
  });
})();
</script>
</body>
</html>
