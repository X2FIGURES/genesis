<!doctype html>
<html lang="en" data-theme="A">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<link rel="icon" href="data:,">
<title>Style quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Palette A — Ivory & Sage. Evening (C) is not drawn here. */
:root{
  --canvas:#E6DFD3;
  --ivory:#F4EFE6;
  --sage:#9DAE8F;
  --sage-deep:#7E9272;
  --sage-fill:#D7E3CE;
  --ink:#2F2B28;
  --muted:#7A736C;
  --champagne:#C9AE7C;
  --line:rgba(201,174,124,.45);
  --serif:"Cormorant Garamond",Palatino,"Palatino Linotype",Georgia,serif;
  --sans:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
html{background:var(--canvas)}
body{
  background:var(--canvas);
  color:var(--ink);
  font-family:var(--sans);
  min-height:100%;
}
body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  opacity:.22;
  mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-size:180px 180px;
}
button{font:inherit;color:inherit}
button:focus{outline:none}
button:focus-visible,a:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.stage{
  position:relative;
  z-index:1;
  height:100%;
  max-width:980px;
  margin:0 auto;
  padding:clamp(14px,3vh,36px) clamp(16px,4vw,48px) clamp(12px,2.4vh,28px);
  display:flex;
  flex-direction:column;
  min-height:0;
}
.head{text-align:center;flex:0 0 auto}
.sprig{display:block;width:96px;height:auto;margin:0 auto 8px}
.eyebrow{
  margin:0;
  font-size:11px;
  font-weight:500;
  letter-spacing:.28em;
  text-transform:uppercase;
  color:var(--champagne);
}
h1{
  margin:8px 0 0;
  font-family:var(--serif);
  font-weight:500;
  font-size:clamp(30px,4.6vw,48px);
  line-height:1.05;
  letter-spacing:-.015em;
}
.rule{width:42px;height:1px;margin:12px auto 0;background:var(--champagne);border:0}
.grid{
  flex:1 1 auto;
  min-height:0;
  margin-top:clamp(14px,2.6vh,28px);
  display:grid;
  grid-template-columns:1fr 1fr;
  grid-template-rows:1fr 1fr;
  gap:clamp(10px,1.6vw,16px);
}
.option{
  position:relative;
  height:100%;
  min-height:92px;
  text-align:left;
  cursor:pointer;
  background:var(--ivory);
  border:1px solid var(--line);
  border-radius:18px;
  padding:clamp(14px,2.4vh,26px) 28px clamp(14px,2.4vh,22px) clamp(18px,2.4vw,32px);
  display:flex;
  flex-direction:column;
  justify-content:center;
  gap:8px;
  transition:background-color .2s ease,border-color .2s ease;
}
.option:hover{background:#EFE8DC}
.option[aria-checked="true"]{background:var(--sage-fill);border-color:transparent}
.option[aria-checked="true"]:hover{background:#D0DEC6}
.name{
  font-family:var(--serif);
  font-weight:500;
  font-size:clamp(26px,3vw,34px);
  letter-spacing:-.01em;
  line-height:1;
}
.sub{
  display:flex;
  align-items:center;
  gap:10px;
  color:var(--muted);
  font-size:clamp(13px,1.5vw,15px);
  font-weight:400;
}
.radio{
  width:15px;height:15px;border-radius:50%;
  border:1.5px solid var(--champagne);
  flex:0 0 auto;
  position:relative;
}
.option[aria-checked="true"] .radio{border-color:var(--sage-deep)}
.option[aria-checked="true"] .radio::after{
  content:"";
  position:absolute;
  inset:3px;
  border-radius:50%;
  background:var(--sage-deep);
}
.mark{
  position:absolute;
  right:22px;
  bottom:16px;
  width:16px;
  height:1px;
  background:var(--champagne);
  opacity:0;
}
.option[aria-checked="true"] .mark{opacity:1}
.dots{
  flex:0 0 auto;
  display:flex;
  justify-content:center;
  gap:9px;
  margin-top:clamp(12px,2.2vh,22px);
  padding-bottom:2px;
}
.dot{
  width:7px;height:7px;border-radius:50%;
  padding:0;
  border:1.5px solid var(--champagne);
  background:transparent;
  cursor:pointer;
}
.dot[aria-current="step"]{background:var(--sage);border-color:var(--sage)}
.dot[disabled]{cursor:default;opacity:.45}
.result{
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:clamp(16px,4vh,40px) 18px;
  position:relative;
  z-index:1;
}
.card{
  width:min(460px,100%);
  background:var(--ivory);
  border:1px solid rgba(201,174,124,.35);
  border-radius:22px;
  box-shadow:0 22px 50px rgba(47,43,40,.08);
  text-align:center;
  padding:clamp(28px,5vh,48px) clamp(22px,4vw,40px) clamp(26px,4vh,40px);
}
.card h1{font-size:clamp(48px,8vw,68px);margin-top:10px}
.vibe{
  margin:16px 0 26px;
  font-family:var(--serif);
  font-style:italic;
  font-weight:500;
  font-size:clamp(17px,2.2vw,21px);
  color:#6F6862;
  line-height:1.35;
}
.cta{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:40px;
  padding:10px 22px;
  border:1px solid var(--champagne);
  border-radius:999px;
  color:var(--ink);
  text-decoration:none;
  font-size:11px;
  font-weight:500;
  letter-spacing:.16em;
  text-transform:uppercase;
}
.cta:hover{background:rgba(201,174,124,.14)}
.retake{
  display:block;
  margin:14px auto 0;
  padding:6px 10px;
  background:none;
  border:0;
  cursor:pointer;
  color:#A89468;
  font-size:11px;
  letter-spacing:.16em;
  text-transform:uppercase;
}
.sr{
  position:absolute;width:1px;height:1px;padding:0;margin:-1px;
  overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;
}
@media (max-width:560px){
  .stage{height:auto;min-height:100%}
  .grid{grid-template-columns:1fr;grid-template-rows:none}
  .option{min-height:88px}
}
@media (prefers-reduced-motion:reduce){
  .option{transition:none}
}
</style>
</head>
<body>
<main id="app"></main>
<p id="live" class="sr" aria-live="polite"></p>
<script>
(function(){
  /*
    Palette A only. theme= other than A still renders Ivory & Sage (Evening C later).
    v1 questions live in QUESTIONS below. A later Template Builder pass can
    replace QUESTIONS / STYLES from a same-origin data.json. Do not call Notion
    from this file. URL params stay the override: ?style= skips to that result.
  */
  var STYLES={
    garden:{name:"Garden",vibe:"Soft greens, outdoor light, gathered florals."},
    modern:{name:"Modern",vibe:"Clean lines, quiet rooms, unfussy light."},
    classic:{name:"Classic",vibe:"Timeless rooms, champagne light, a long table."},
    intimate:{name:"Intimate",vibe:"Few guests, candle hush, everyone near."}
  };
  var QUESTIONS=[
    {prompt:"Which feels more like you?",options:[
      {style:"garden",line:"Outdoor light · soft greens"},
      {style:"modern",line:"Clean lines · quiet rooms"},
      {style:"classic",line:"Timeless · champagne light"},
      {style:"intimate",line:"Few guests · candle hush"}
    ]},
    {prompt:"Where should the day begin?",options:[
      {style:"garden",line:"A lawn after rain"},
      {style:"modern",line:"One quiet window"},
      {style:"classic",line:"Tall doors, old stone"},
      {style:"intimate",line:"A table for your people"}
    ]},
    {prompt:"What should guests remember?",options:[
      {style:"garden",line:"Leaves and open air"},
      {style:"modern",line:"The quiet between courses"},
      {style:"classic",line:"Light on the glass"},
      {style:"intimate",line:"How close they sat"}
    ]},
    {prompt:"How should the evening feel?",options:[
      {style:"garden",line:"Lanterns on a path"},
      {style:"modern",line:"Low light, no fuss"},
      {style:"classic",line:"Music, then a long dinner"},
      {style:"intimate",line:"Candles and one toast"}
    ]},
    {prompt:"The room you would turn down",options:[
      {style:"garden",line:"A hall with no garden"},
      {style:"modern",line:"Anything that shouts"},
      {style:"classic",line:"A room with no history"},
      {style:"intimate",line:"A ballroom for hundreds"}
    ]}
  ];
  var SPRIG='<svg class="sprig" viewBox="0 0 150 70" fill="none" aria-hidden="true">'+
    '<path d="M10 56c32-2 58-16 90-36 14-8 28-12 42-14" stroke="#8EA383" stroke-width="1.15" stroke-linecap="round"/>'+
    '<path d="M34 50c8-10 18-9 20-1-8 1-16 3-20 1z" fill="#9DAE8F"/>'+
    '<path d="M52 42c10 6 16-4 8-12-8 2-12 8-8 12z" fill="#A9B99A"/>'+
    '<path d="M70 36c8-11 20-8 20 0-9 1-16 2-20 0z" fill="#8EA383"/>'+
    '<path d="M90 28c9 5 16-5 7-12-8 2-11 8-7 12z" fill="#9DAE8F"/>'+
    '<path d="M108 22c8-9 18-6 17 1-8 0-14 2-17-1z" fill="#A9B99A"/>'+
    '<path d="M124 16c7 4 13-3 6-9-6 1-9 6-6 9z" fill="#8EA383"/>'+
    '<ellipse cx="78" cy="44" rx="3" ry="4.2" transform="rotate(16 78 44)" fill="#C9AE7C"/>'+
    '<ellipse cx="112" cy="30" rx="2.6" ry="3.6" transform="rotate(-12 112 30)" fill="#C9AE7C"/>'+
    '</svg>';

  var q=new URLSearchParams(location.search);
  var theme=(q.get("theme")||"A").toUpperCase();
  document.documentElement.setAttribute("data-theme",theme==="A"?"A":"A");
  var app=document.getElementById("app");
  var live=document.getElementById("live");
  var answers=[];
  var step=0;
  var timer=null;
  var mode="ask";
  var reduce=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function el(tag,cls,text){
    var n=document.createElement(tag);
    if(cls)n.className=cls;
    if(text!=null)n.textContent=text;
    return n;
  }
  function tally(){
    var score={garden:0,modern:0,classic:0,intimate:0};
    answers.forEach(function(s){if(score[s]!=null)score[s]++;});
    var best=0;
    Object.keys(score).forEach(function(k){if(score[k]>best)best=score[k];});
    for(var i=answers.length-1;i>=0;i--){
      if(score[answers[i]]===best)return answers[i];
    }
    return "garden";
  }
  function clearTimer(){if(timer){clearTimeout(timer);timer=null;}}

  function paintQuestion(){
    mode="ask";
    clearTimer();
    app.textContent="";
    document.title="Style quiz";
    var stage=el("div","stage");
    var head=el("header","head");
    head.insertAdjacentHTML("afterbegin",SPRIG);
    head.appendChild(el("p","eyebrow","Style quiz"));
    var h=el("h1",null,QUESTIONS[step].prompt);
    h.id="prompt";
    head.appendChild(h);
    head.appendChild(el("div","rule"));
    stage.appendChild(head);

    var grid=el("div","grid");
    grid.setAttribute("role","radiogroup");
    grid.setAttribute("aria-labelledby","prompt");
    QUESTIONS[step].options.forEach(function(opt,i){
      var b=el("button","option");
      b.type="button";
      b.setAttribute("role","radio");
      var on=answers[step]===opt.style;
      b.setAttribute("aria-checked",on?"true":"false");
      b.setAttribute("aria-label",STYLES[opt.style].name+". "+opt.line);
      var name=el("span","name",STYLES[opt.style].name);
      var sub=el("span","sub");
      sub.appendChild(el("span","radio"));
      sub.appendChild(document.createTextNode(opt.line));
      b.appendChild(name);
      b.appendChild(sub);
      b.appendChild(el("span","mark"));
      b.addEventListener("click",function(){choose(opt.style);});
      grid.appendChild(b);
      if(i===0)b.dataset.first="1";
    });
    grid.addEventListener("keydown",function(e){
      var keys=["ArrowRight","ArrowLeft","ArrowDown","ArrowUp"];
      if(keys.indexOf(e.key)<0)return;
      var btns=grid.querySelectorAll(".option");
      var i=Array.prototype.indexOf.call(btns,document.activeElement);
      if(i<0)return;
      e.preventDefault();
      var cols=window.matchMedia("(max-width: 560px)").matches?1:2;
      var next=i;
      if(e.key==="ArrowRight")next=(i+1)%btns.length;
      if(e.key==="ArrowLeft")next=(i+btns.length-1)%btns.length;
      if(e.key==="ArrowDown")next=(i+cols)%btns.length;
      if(e.key==="ArrowUp")next=(i-cols+btns.length)%btns.length;
      btns[next].focus();
    });
    stage.appendChild(grid);

    var dots=el("div","dots");
    dots.setAttribute("role","group");
    dots.setAttribute("aria-label","Questions");
    QUESTIONS.forEach(function(_,i){
      var d=el("button","dot");
      d.type="button";
      var reached=i<=step||answers[i];
      d.disabled=!reached;
      if(i===step)d.setAttribute("aria-current","step");
      d.setAttribute("aria-label","Question "+(i+1)+" of "+QUESTIONS.length);
      d.addEventListener("click",function(){
        if(d.disabled)return;
        clearTimer();
        step=i;
        paintQuestion();
      });
      dots.appendChild(d);
    });
    stage.appendChild(dots);
    app.appendChild(stage);
    live.textContent="Question "+(step+1)+" of "+QUESTIONS.length+". "+QUESTIONS[step].prompt;
  }

  function choose(style){
    answers[step]=style;
    var buttons=app.querySelectorAll(".option");
    QUESTIONS[step].options.forEach(function(opt,i){
      buttons[i].setAttribute("aria-checked",opt.style===style?"true":"false");
    });
    clearTimer();
    var going=step;
    var wait=reduce?60:480;
    timer=setTimeout(function(){
      if(going!==step||mode!=="ask")return;
      if(step>=QUESTIONS.length-1)paintResult(tally());
      else{step++;paintQuestion();}
    },wait);
  }

  function paintResult(id){
    mode="result";
    clearTimer();
    var style=STYLES[id]||STYLES.garden;
    id=STYLES[id]?id:"garden";
    app.textContent="";
    document.title="Your style · "+style.name;
    var wrap=el("div","result");
    var card=el("article","card");
    card.insertAdjacentHTML("afterbegin",SPRIG);
    card.appendChild(el("p","eyebrow","Your style"));
    var h=el("h1",null,style.name);
    h.id="style-name";
    h.tabIndex=-1;
    card.appendChild(h);
    card.appendChild(el("div","rule"));
    card.appendChild(el("p","vibe",style.vibe));
    var a=el("a","cta","See matching venues");
    a.href="venue-moodboard.html?style="+encodeURIComponent(id);
    card.appendChild(a);
    var again=el("button","retake","Retake");
    again.type="button";
    again.addEventListener("click",function(){
      answers=[];
      step=0;
      paintQuestion();
    });
    card.appendChild(again);
    wrap.appendChild(card);
    app.appendChild(wrap);
    live.textContent="Your style is "+style.name+". "+style.vibe;
    h.focus();
  }

  var preset=(q.get("style")||"").toLowerCase();
  if(STYLES[preset])paintResult(preset);
  else paintQuestion();
})();
</script>
</body>
</html>
