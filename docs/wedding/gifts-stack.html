<!doctype html>
<html lang="en" data-theme="A">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<link rel="icon" href="data:,">
<title>Gifts stack</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --canvas:#EDE6DA;--ivory:#F8F5EF;--row:#E7E0D4;--sage:#9DAE8F;--sage-deep:#6F8A62;--sage-fill:#E3EBDC;
  --ink:#2F2B28;--muted:#7A736C;--champagne:#C9AE7C;--line:rgba(201,174,124,.45);
  --serif:"Cormorant Garamond",Palatino,"Palatino Linotype",Georgia,serif;
  --sans:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
html{background:var(--canvas)}
body{
  min-height:100%;background:var(--canvas);color:var(--ink);font-family:var(--sans);
  display:flex;justify-content:center;padding:clamp(12px,2.4vh,24px) clamp(12px,3vw,22px);
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;opacity:.2;mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-size:180px 180px;
}
button{font:inherit;color:inherit}
button:focus{outline:none}
button:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.card{
  position:relative;z-index:1;width:min(520px,100%);margin:auto;
  background:var(--ivory);border:1px solid var(--line);border-radius:26px;
  box-shadow:0 18px 44px rgba(47,43,40,.06);
  padding:clamp(16px,3vh,26px) clamp(14px,3vw,22px) 16px;
  display:flex;flex-direction:column;min-height:0;
}
.head{text-align:center}
.eyebrow{margin:0;font-size:11px;font-weight:500;letter-spacing:.26em;text-transform:uppercase;color:var(--champagne)}
h1{margin:6px 0 0;font-family:var(--serif);font-weight:500;font-size:clamp(28px,4vw,36px);letter-spacing:-.02em}
.rule{width:42px;height:1px;margin:10px auto 0;background:var(--champagne);border:0}
.filters{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
.filters button{
  border:1px solid var(--champagne);background:transparent;border-radius:999px;
  padding:6px 12px;cursor:pointer;font-size:13px;
}
.filters button[aria-pressed="true"]{background:var(--sage-fill);border-color:transparent}
.stack{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.gift{
  display:grid;grid-template-columns:58px minmax(0,1fr);gap:4px 8px;align-items:center;
  background:var(--row);border-radius:16px;padding:10px 14px 10px 12px;scroll-margin:12px;
}
.gift.is-on{background:var(--sage-fill)}
.band{font-family:var(--serif);font-size:24px;color:var(--champagne);line-height:1}
.gift.is-on .band{color:var(--sage-deep)}
.who{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--champagne);font-weight:500}
.name{font-family:var(--serif);font-weight:500;font-size:clamp(20px,3vw,26px);line-height:1.05;letter-spacing:-.015em}
.thanks{grid-column:2;margin:0;color:var(--muted);font-size:12.5px;line-height:1.35}
.split{
  margin:2px 0;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#A39B92;font-weight:500;
}
.empty,.err{margin:18px 0;text-align:center;font-family:var(--serif);font-style:italic;font-size:22px;color:var(--muted)}
</style>
</head>
<body>
<article class="card">
  <header class="head">
    <p class="eyebrow">Gifts stack</p>
    <h1>In-product gifts</h1>
    <hr class="rule">
  </header>
  <div class="filters" id="filters" role="group" aria-label="Culture"></div>
  <div class="stack" id="stack" role="list"></div>
</article>
<script>
(function(){
  var q = new URLSearchParams(location.search);
  var items = [];
  var tag = "";
  var filters = document.getElementById("filters");
  var stack = document.getElementById("stack");

  function el(tagName, cls, text){
    var n = document.createElement(tagName);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function uniq(list){
    var seen = {};
    var out = [];
    list.forEach(function(item){
      if (!item || seen[item]) return;
      seen[item] = true;
      out.push(item);
    });
    return out;
  }
  function ordered(){
    var copy = items.slice();
    if (!tag) return copy;
    var top = [];
    var rest = [];
    copy.forEach(function(item){
      if ((item.tags || []).indexOf(tag) >= 0) top.push(item);
      else rest.push(item);
    });
    return {top:top, rest:rest};
  }
  function addGift(item, hash){
    var row = el("article", "gift");
    row.id = item.id;
    row.setAttribute("role", "listitem");
    if (item.id === hash) row.classList.add("is-on");
    row.appendChild(el("span", "band", item.budgetBand || ""));
    var copy = el("div");
    copy.appendChild(el("p", "who", item.forWhom || ""));
    copy.appendChild(el("h2", "name", item.name));
    row.appendChild(copy);
    row.appendChild(el("p", "thanks", item.thankYouSeed || ""));
    stack.appendChild(row);
  }
  function render(){
    stack.textContent = "";
    [].forEach.call(filters.querySelectorAll("button"), function(b){
      b.setAttribute("aria-pressed", (b.getAttribute("data-tag") || "") === tag ? "true" : "false");
    });
    if (!items.length){
      stack.appendChild(el("p", "empty", "No gifts yet"));
      return;
    }
    var hash = decodeURIComponent((location.hash || "").replace(/^#/, ""));
    var groups = ordered();
    if (!tag){
      groups.forEach(function(item){ addGift(item, hash); });
    } else {
      if (groups.top.length){
        stack.appendChild(el("p", "split", tag));
        groups.top.forEach(function(item){ addGift(item, hash); });
      }
      if (groups.rest.length){
        stack.appendChild(el("p", "split", "Other gifts"));
        groups.rest.forEach(function(item){ addGift(item, hash); });
      }
    }
    if (hash){
      var node = document.getElementById(hash);
      if (node && node.scrollIntoView) node.scrollIntoView({block:"nearest"});
    }
  }

  fetch(q.get("src") || "gifts-stack.json", {cache:"no-store"}).then(function(r){
    if (!r.ok) throw new Error("missing");
    return r.json();
  }).then(function(json){
    items = json.items || [];
    var tags = uniq([].concat.apply([], items.map(function(item){ return item.tags || []; })));
    function chip(label, value){
      var b = el("button", null, label);
      b.type = "button";
      b.setAttribute("data-tag", value);
      b.setAttribute("aria-pressed", "false");
      b.addEventListener("click", function(){ tag = value; render(); });
      filters.appendChild(b);
    }
    chip("All", "");
    tags.forEach(function(t){ chip(t, t); });
    var preset = (q.get("culture") || "").toLowerCase();
    if (preset) tags.forEach(function(t){ if (t.toLowerCase() === preset) tag = t; });
    render();
  }).catch(function(){
    stack.appendChild(el("p", "err", "Seed missing"));
  });
})();
</script>
</body>
</html>
