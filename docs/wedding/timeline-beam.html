<!doctype html>
<html lang="en" data-theme="A">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<link rel="icon" href="data:,">
<title>Timeline beam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --canvas:#EDE6DA;--ivory:#F8F5EF;--sage:#9DAE8F;--ink:#2F2B28;--muted:#7A736C;--champagne:#C9AE7C;
  --serif:"Cormorant Garamond",Palatino,"Palatino Linotype",Georgia,serif;
  --sans:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
html{background:var(--canvas)}
body{height:100%;background:var(--canvas);color:var(--ink);font-family:var(--sans)}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;opacity:.18;mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-size:180px 180px;
}
.frame{
  position:relative;z-index:1;height:100%;max-width:880px;margin:0 auto;
  padding:clamp(14px,2.4vh,24px) clamp(14px,2.6vw,28px);
  display:flex;flex-direction:column;min-height:0;
  background:transparent;
}
.card{
  flex:1 1 auto;min-height:0;background:var(--ivory);border:1px solid rgba(201,174,124,.35);
  border-radius:24px;padding:16px 16px 12px;display:flex;flex-direction:column;
}
.eyebrow{margin:0;font-size:11px;font-weight:500;letter-spacing:.24em;text-transform:uppercase;color:var(--champagne)}
h1{margin:4px 0 0;font-family:var(--serif);font-weight:500;font-size:clamp(28px,4vw,40px);letter-spacing:-.02em;line-height:1}
.chart{flex:1 1 auto;min-height:120px;margin-top:4px}
svg{width:100%;height:100%;display:block}
svg text{fill:var(--ink);font-family:var(--sans)}
svg .phase{fill:#C9AE7C;font-size:12px;letter-spacing:.16em}
svg .num{font-family:var(--serif);font-size:32px}
.note{margin:4px 0 0;font-size:12px;color:var(--muted)}
.err{margin:auto;font-family:var(--serif);font-style:italic;font-size:22px;color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
</style>
</head>
<body>
<article class="frame">
  <div class="card">
    <header>
      <p class="eyebrow">Timeline beam</p>
      <h1>Chips by phase</h1>
    </header>
    <div class="chart" id="chart"></div>
    <p class="note" id="note"></p>
    <table class="sr" id="table"></table>
  </div>
</article>
<script>
(function(){
  var PHASES = [
    {key:"planning", label:"PLANNING"},
    {key:"dday", label:"D-DAY"},
    {key:"after", label:"AFTER"}
  ];
  var NS = "http://www.w3.org/2000/svg";
  var q = new URLSearchParams(location.search);
  function svg(name, attrs){
    var n = document.createElementNS(NS, name);
    if (attrs) Object.keys(attrs).forEach(function(k){ n.setAttribute(k, attrs[k]); });
    return n;
  }
  function text(x, y, value, cls, anchor){
    var n = svg("text", {x:String(x), y:String(y)});
    if (cls) n.setAttribute("class", cls);
    if (anchor) n.setAttribute("text-anchor", anchor);
    n.textContent = value;
    return n;
  }
  fetch(q.get("src") || "culture-process.json", {cache:"no-store"}).then(function(r){
    if (!r.ok) throw new Error("missing");
    return r.json();
  }).then(function(data){
    var counts = PHASES.map(function(phase){
      var seen = {};
      (data.cultures || []).forEach(function(c){
        ((c.phases && c.phases[phase.key]) || []).forEach(function(chip){
          if (chip && chip.id) seen[chip.id] = true;
        });
      });
      return Object.keys(seen).length;
    });
    var max = Math.max.apply(null, counts.concat([1]));
    var root = svg("svg", {viewBox:"0 0 640 210", role:"img"});
    var title = svg("title");
    title.textContent = PHASES.map(function(p, i){ return p.label + " " + counts[i]; }).join(", ");
    root.appendChild(title);
    var xs = [90, 320, 550];
    root.appendChild(svg("line", {x1:"90", y1:"108", x2:"550", y2:"108", stroke:"#C9AE7C", "stroke-width":"1.25"}));
    counts.forEach(function(n, i){
      var radius = 16 + Math.round(14 * n / max);
      var opacity = (0.4 + 0.6 * n / max).toFixed(2);
      root.appendChild(svg("circle", {
        cx:String(xs[i]), cy:"108", r:String(radius),
        fill:"#9DAE8F", "fill-opacity":opacity, stroke:"#9DAE8F", "stroke-width":"1.25"
      }));
      root.appendChild(text(xs[i], 36, PHASES[i].label, "phase", "middle"));
      root.appendChild(text(xs[i], 178, String(n), "num", "middle"));
    });
    document.getElementById("chart").appendChild(root);
    document.getElementById("note").textContent = "Planning " + counts[0] + " · D-day " + counts[1] + " · After " + counts[2] + ". Unique chips. A chip in two phases counts in each. No milestone NOW in this seed.";
    var table = document.getElementById("table");
    var trh = document.createElement("tr");
    var tr = document.createElement("tr");
    PHASES.forEach(function(phase, i){
      var th = document.createElement("th");
      th.textContent = phase.label;
      trh.appendChild(th);
      var td = document.createElement("td");
      td.textContent = String(counts[i]);
      tr.appendChild(td);
    });
    table.appendChild(trh);
    table.appendChild(tr);
  }).catch(function(){
    document.getElementById("chart").appendChild(Object.assign(document.createElement("p"), {className:"err", textContent:"Seed missing"}));
  });
})();
</script>
</body>
</html>
