<!doctype html>
<html lang="en" data-theme="A">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<link rel="icon" href="data:,">
<title>Budget band mix</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --canvas:#EDE6DA;--ivory:#F8F5EF;--sage:#9DAE8F;--ink:#2F2B28;--muted:#7A736C;--champagne:#C9AE7C;--line:rgba(201,174,124,.45);
  --serif:"Cormorant Garamond",Palatino,"Palatino Linotype",Georgia,serif;
  --sans:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
html{background:var(--canvas)}
body{height:100%;background:var(--canvas);color:var(--ink);font-family:var(--sans)}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;opacity:.18;mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-size:180px 180px;
}
.frame{
  position:relative;z-index:1;height:100%;max-width:880px;margin:0 auto;
  padding:clamp(14px,2.4vh,24px) clamp(14px,2.6vw,28px);
  display:flex;flex-direction:column;min-height:0;
}
.eyebrow{margin:0;font-size:11px;font-weight:500;letter-spacing:.24em;text-transform:uppercase;color:var(--champagne)}
h1{margin:4px 0 0;font-family:var(--serif);font-weight:500;font-size:clamp(28px,4vw,40px);letter-spacing:-.02em;line-height:1}
.chart{flex:1 1 auto;min-height:0;margin-top:8px}
svg{width:100%;height:100%;display:block}
svg text{fill:var(--ink);font-family:var(--sans);font-size:14px}
svg .num{font-family:var(--serif);font-size:26px}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;margin:6px 0 0;padding:0;list-style:none}
.legend li{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.legend .zero{opacity:.55}
.swatch{width:12px;height:12px;border-radius:4px}
.note{margin:8px 0 0;font-size:12px;color:var(--muted)}
.err{margin:auto;font-family:var(--serif);font-style:italic;font-size:22px;color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
</style>
</head>
<body>
<article class="frame">
  <header>
    <p class="eyebrow">Budget band mix</p>
    <h1>Dress and gifts</h1>
  </header>
  <div class="chart" id="chart"></div>
  <ul class="legend" id="legend"></ul>
  <p class="note" id="note"></p>
  <table class="sr" id="table"></table>
</article>
<script>
(function(){
  var BANDS = ["$","$$","$$$","$$$$"];
  var COLORS = {"$":"#E4D3B0","$$":"#C9AE7C","$$$":"#9DAE8F","$$$$":"#6F8A62"};
  var NS = "http://www.w3.org/2000/svg";
  var q = new URLSearchParams(location.search);
  function svg(name, attrs){
    var n = document.createElementNS(NS, name);
    if (attrs) Object.keys(attrs).forEach(function(k){ n.setAttribute(k, attrs[k]); });
    return n;
  }
  function text(x, y, value, cls){
    var n = svg("text", {x:String(x), y:String(y)});
    if (cls) n.setAttribute("class", cls);
    n.textContent = value;
    return n;
  }
  function load(src){
    return fetch(src, {cache:"no-store"}).then(function(r){
      if (!r.ok) throw new Error(src);
      return r.json();
    });
  }
  function tally(items){
    var map = {};
    BANDS.forEach(function(b){ map[b] = 0; });
    (items || []).forEach(function(item){
      var key = item.budgetBand || "Untagged";
      map[key] = (map[key] || 0) + 1;
    });
    return map;
  }
  function keysOf(maps){
    var list = BANDS.slice();
    maps.forEach(function(map){
      Object.keys(map).forEach(function(k){ if (list.indexOf(k) < 0) list.push(k); });
    });
    return list;
  }
  function sum(map, keys){
    var n = 0;
    keys.forEach(function(k){ n += map[k] || 0; });
    return n;
  }
  function add(a, b, keys){
    var map = {};
    keys.forEach(function(k){ map[k] = (a[k] || 0) + (b[k] || 0); });
    return map;
  }

  Promise.all([
    load(q.get("dress") || "dress-rail.json"),
    load(q.get("gifts") || "gifts-stack.json")
  ]).then(function(all){
    var dress = tally(all[0].items);
    var gifts = tally(all[1].items);
    var keys = keysOf([dress, gifts]);
    var both = add(dress, gifts, keys);
    var rows = [
      {label:"All", counts:both},
      {label:"Dress", counts:dress},
      {label:"Gifts", counts:gifts}
    ];
    var root = svg("svg", {viewBox:"0 0 640 210", role:"img"});
    var title = svg("title");
    title.textContent = "Budget bands " + keys.map(function(k){ return k + " " + (both[k] || 0); }).join(", ");
    root.appendChild(title);
    var defs = svg("defs");
    root.appendChild(defs);
    var x0 = 92;
    var trackW = 430;
    rows.forEach(function(row, i){
      var y = 24 + i * 62;
      var rowTotal = sum(row.counts, keys) || 1;
      var clip = svg("clipPath", {id:"band-" + i});
      clip.appendChild(svg("rect", {x:String(x0), y:String(y + 6), width:String(trackW), height:"26", rx:"13"}));
      defs.appendChild(clip);
      root.appendChild(text(8, y + 26, row.label));
      root.appendChild(svg("rect", {x:String(x0), y:String(y + 6), width:String(trackW), height:"26", rx:"13", fill:"#EDE6DA"}));
      var group = svg("g", {"clip-path":"url(#band-" + i + ")"});
      var x = x0;
      keys.forEach(function(key){
        var n = row.counts[key] || 0;
        if (!n) return;
        var w = Math.round(trackW * n / rowTotal);
        if (x + w > x0 + trackW) w = x0 + trackW - x;
        group.appendChild(svg("rect", {x:String(x), y:String(y + 6), width:String(Math.max(w, 1)), height:"26", fill:COLORS[key] || "#A89880"}));
        x += w;
      });
      root.appendChild(group);
      root.appendChild(text(x0 + trackW + 16, y + 28, String(sum(row.counts, keys)), "num"));
    });
    document.getElementById("chart").appendChild(root);
    var legend = document.getElementById("legend");
    keys.forEach(function(key){
      var n = both[key] || 0;
      var li = document.createElement("li");
      if (!n) li.className = "zero";
      var sw = document.createElement("span");
      sw.className = "swatch";
      sw.style.background = COLORS[key] || "#A89880";
      li.appendChild(sw);
      li.appendChild(document.createTextNode(key + " · " + n));
      legend.appendChild(li);
    });
    document.getElementById("note").textContent = "In-product dress and gifts only. Culture concepts have no budget band.";
    var table = document.getElementById("table");
    var head = document.createElement("tr");
    head.appendChild(document.createElement("th"));
    keys.forEach(function(key){
      var th = document.createElement("th");
      th.textContent = key;
      head.appendChild(th);
    });
    table.appendChild(head);
    rows.forEach(function(row){
      var tr = document.createElement("tr");
      var th = document.createElement("th");
      th.textContent = row.label;
      tr.appendChild(th);
      keys.forEach(function(key){
        var td = document.createElement("td");
        td.textContent = String(row.counts[key] || 0);
        tr.appendChild(td);
      });
      table.appendChild(tr);
    });
  }).catch(function(){
    document.getElementById("chart").appendChild(Object.assign(document.createElement("p"), {className:"err", textContent:"Seed missing"}));
  });
})();
</script>
</body>
</html>
