<!doctype html>
<html lang="en" data-theme="A">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<link rel="icon" href="data:,">
<title>Coverage map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --canvas:#EDE6DA;--ivory:#F8F5EF;--sage:#9DAE8F;--ink:#2F2B28;--muted:#7A736C;--champagne:#C9AE7C;--line:rgba(201,174,124,.45);
  --serif:"Cormorant Garamond",Palatino,"Palatino Linotype",Georgia,serif;
  --sans:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
html{background:var(--canvas)}
body{height:100%;background:var(--canvas);color:var(--ink);font-family:var(--sans)}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;opacity:.18;mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-size:180px 180px;
}
.frame{
  position:relative;z-index:1;height:100%;max-width:880px;margin:0 auto;
  padding:clamp(14px,2.2vh,22px) clamp(14px,2.6vw,28px);
  display:flex;flex-direction:column;min-height:0;
}
.eyebrow{margin:0;font-size:11px;font-weight:500;letter-spacing:.24em;text-transform:uppercase;color:var(--champagne)}
h1{margin:4px 0 0;font-family:var(--serif);font-weight:500;font-size:clamp(28px,4vw,40px);letter-spacing:-.02em;line-height:1}
.chart{flex:1 1 auto;min-height:0;margin-top:6px}
svg{width:100%;height:100%;display:block}
svg text{fill:var(--ink);font-family:var(--sans);font-size:14px}
svg .head{fill:#C9AE7C;font-size:11px;letter-spacing:.14em}
svg .num{font-family:var(--serif);font-size:16px}
.note{margin:6px 0 0;font-size:12px;color:var(--muted)}
.err{margin:auto;font-family:var(--serif);font-style:italic;font-size:22px;color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
</style>
</head>
<body>
<article class="frame">
  <header>
    <p class="eyebrow">Coverage map</p>
    <h1>Culture bundles</h1>
  </header>
  <div class="chart" id="chart"></div>
  <p class="note" id="note">Cells count chips in that phase. Markets are not in this seed.</p>
  <table class="sr" id="table"></table>
</article>
<script>
(function(){
  var PHASES = [
    {key:"planning", label:"PLANNING"},
    {key:"dday", label:"D-DAY"},
    {key:"after", label:"AFTER"}
  ];
  var NS = "http://www.w3.org/2000/svg";
  var q = new URLSearchParams(location.search);
  function svg(name, attrs){
    var n = document.createElementNS(NS, name);
    if (attrs) Object.keys(attrs).forEach(function(k){ n.setAttribute(k, attrs[k]); });
    return n;
  }
  function text(x, y, value, cls, anchor){
    var n = svg("text", {x:String(x), y:String(y)});
    if (cls) n.setAttribute("class", cls);
    if (anchor) n.setAttribute("text-anchor", anchor);
    n.textContent = value;
    return n;
  }
  fetch(q.get("src") || "culture-process.json", {cache:"no-store"}).then(function(r){
    if (!r.ok) throw new Error("missing");
    return r.json();
  }).then(function(data){
    var cultures = data.cultures || [];
    var rowH = 52;
    var height = 36 + cultures.length * rowH + 8;
    var root = svg("svg", {viewBox:"0 0 640 " + height, role:"img"});
    var title = svg("title");
    title.textContent = "Culture bundles by phase";
    root.appendChild(title);
    var cols = [230, 380, 530];
    PHASES.forEach(function(phase, i){
      root.appendChild(text(cols[i], 22, phase.label, "head", "middle"));
    });
    var table = document.getElementById("table");
    var hr = document.createElement("tr");
    hr.appendChild(document.createElement("th"));
    PHASES.forEach(function(phase){
      var th = document.createElement("th");
      th.textContent = phase.label;
      hr.appendChild(th);
    });
    table.appendChild(hr);
    cultures.forEach(function(c, i){
      var y = 36 + i * rowH;
      var cy = y + rowH / 2;
      root.appendChild(text(8, cy + 5, c.label || c.id));
      var tr = document.createElement("tr");
      var th = document.createElement("th");
      th.textContent = c.label || c.id;
      tr.appendChild(th);
      PHASES.forEach(function(phase, p){
        var n = ((c.phases && c.phases[phase.key]) || []).length;
        var r = n === 0 ? 6 : Math.min(16, 7 + n * 3);
        var fill = n === 0 ? "none" : "#9DAE8F";
        var opacity = n === 0 ? "1" : String(Math.min(1, 0.5 + n * 0.2));
        root.appendChild(svg("circle", {
          cx:String(cols[p] - 16), cy:String(cy), r:String(r),
          fill:fill, "fill-opacity":opacity, stroke:"#C9AE7C", "stroke-width":n ? "0" : "1.25"
        }));
        var num = text(cols[p] + 4, cy + 5, String(n), "num", "start");
        if (!n) num.setAttribute("fill", "#7A736C");
        root.appendChild(num);
        var td = document.createElement("td");
        td.textContent = String(n);
        tr.appendChild(td);
      });
      table.appendChild(tr);
    });
    document.getElementById("chart").appendChild(root);
  }).catch(function(){
    document.getElementById("note").textContent = "";
    document.getElementById("chart").appendChild(Object.assign(document.createElement("p"), {className:"err", textContent:"Seed missing"}));
  });
})();
</script>
</body>
</html>
