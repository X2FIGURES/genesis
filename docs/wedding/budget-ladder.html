<!doctype html>
<html lang="en" data-theme="A">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<link rel="icon" href="data:,">
<title>Budget ladder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Palette A — Ivory & Sage. Evening (C) is not drawn here. */
:root{
  --canvas:#E6DFD3;
  --ivory:#F4EFE6;
  --row:#E8E1D4;
  --sage:#9DAE8F;
  --sage-deep:#6F8A62;
  --sage-fill:#E1ECD8;
  --ink:#2F2B28;
  --muted:#7A736C;
  --champagne:#C9AE7C;
  --serif:"Cormorant Garamond",Palatino,"Palatino Linotype",Georgia,serif;
  --sans:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
html{background:var(--canvas)}
body{
  min-height:100%;
  background:var(--canvas);
  color:var(--ink);
  font-family:var(--sans);
  display:flex;
  align-items:stretch;
  justify-content:center;
  padding:clamp(12px,2.6vh,28px) clamp(12px,3vw,24px);
}
body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  opacity:.22;
  mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-size:180px 180px;
}
button{font:inherit;color:inherit}
button:focus{outline:none}
button:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.card{
  position:relative;
  z-index:1;
  width:min(480px,100%);
  margin:auto;
  max-height:100%;
  flex:1 1 auto;
  display:flex;
  flex-direction:column;
  background:var(--ivory);
  border:1px solid rgba(201,174,124,.35);
  border-radius:26px;
  box-shadow:0 18px 44px rgba(47,43,40,.07);
  padding:clamp(16px,3vh,28px) clamp(14px,3vw,22px) 14px;
  min-height:0;
}
.head{text-align:center;flex:0 0 auto}
.wreath{display:block;width:52px;height:52px;margin:0 auto 2px}
.eyebrow{
  margin:0;
  font-size:11px;
  font-weight:500;
  letter-spacing:.26em;
  text-transform:uppercase;
  color:var(--champagne);
}
h1{
  margin:6px 0 0;
  font-family:var(--serif);
  font-weight:500;
  font-size:clamp(28px,4.4vw,36px);
  letter-spacing:-.02em;
  line-height:1.05;
}
.rule{width:42px;height:1px;margin:10px auto 0;background:var(--champagne);border:0}
.rungs{
  flex:1 1 auto;
  min-height:0;
  display:flex;
  flex-direction:column;
  gap:10px;
  margin-top:clamp(12px,2.4vh,20px);
}
.rung{
  flex:1 1 auto;
  min-height:64px;
  display:grid;
  grid-template-columns:58px minmax(0,1fr) 46px;
  align-items:center;
  gap:6px;
  width:100%;
  text-align:left;
  cursor:pointer;
  background:var(--row);
  border:1px solid transparent;
  border-radius:16px;
  padding:10px 14px 10px 12px;
  transition:background-color .2s ease,box-shadow .2s ease;
}
.rung:hover{background:#EFE8DC}
.rung.is-you{
  background:var(--sage-fill);
  box-shadow:0 0 0 1px rgba(157,174,143,.28),0 8px 22px rgba(157,174,143,.16);
}
.rung.is-you:hover{background:#D7E6CC}
.marks{
  font-family:var(--serif);
  font-weight:500;
  font-size:clamp(20px,3vw,26px);
  letter-spacing:.02em;
  color:var(--champagne);
  line-height:1;
}
.rung.is-you .marks{color:var(--sage-deep)}
.band{
  display:block;
  font-family:var(--serif);
  font-weight:500;
  font-size:clamp(22px,3vw,28px);
  letter-spacing:-.015em;
  line-height:1;
}
.covers{
  display:block;
  margin-top:4px;
  color:var(--muted);
  font-size:clamp(12px,1.6vw,13.5px);
  line-height:1.35;
}
.you{
  justify-self:end;
  align-self:center;
  font-size:11px;
  font-weight:500;
  letter-spacing:.18em;
  text-transform:uppercase;
  color:#8A9184;
  visibility:hidden;
}
.rung.is-you .you{visibility:visible}
.note{
  flex:0 0 auto;
  margin:10px 0 2px;
  text-align:center;
  font-size:10px;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:#A39B92;
}
.sr{
  position:absolute;width:1px;height:1px;padding:0;margin:-1px;
  overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;
}
@media (prefers-reduced-motion:reduce){
  .rung{transition:none}
}
</style>
</head>
<body>
<article class="card">
  <header class="head">
    <svg class="wreath" viewBox="0 0 64 64" aria-hidden="true">
      <circle cx="32" cy="38" r="13.5" fill="none" stroke="#9DAE8F" stroke-width="1.15"/>
      <path d="M32 25.5c-1.4-7.2 4.2-12.2 8.4-10.2-3.4 1.5-5.8 6.2-5.4 10.4z" fill="#9DAE8F"/>
      <path d="M30.6 24.8c1.2-7.2-4.8-11.4-8.6-9.2 2.8 1.8 5.2 6.4 5.4 10.2z" fill="#87A07A"/>
      <path d="M32 31.5v5.5" stroke="#C9AE7C" stroke-width="1.1" stroke-linecap="round"/>
      <circle cx="32" cy="40" r="1.5" fill="#C9AE7C"/>
    </svg>
    <p class="eyebrow">Budget ladder</p>
    <h1>What each band covers</h1>
    <div class="rule"></div>
  </header>
  <div class="rungs" id="rungs" role="list"></div>
  <p class="note">Example bands</p>
</article>
<p id="live" class="sr" aria-live="polite"></p>
<script>
(function(){
  /*
    Palette A only. theme= other than A still renders Ivory & Sage.
    BANDS are example / placeholder lines, not a researched price list.
    Later, Template Builder can replace BANDS from a same-origin data.json
    (catering tiers + venues). Do not call Notion from this file.
    URL override: ?band=budget|mid|elevated|blacktie  or  0–3. Default mid.
  */
  var BANDS=[
    {id:"budget",marks:"$",name:"Budget",covers:"Garden venues · buffet or food truck · seasonal florals"},
    {id:"mid",marks:"$$",name:"Mid",covers:"Boutique hotels · plated dinner · local florist"},
    {id:"elevated",marks:"$$$",name:"Elevated",covers:"Estate houses · stations + plated · full florals"},
    {id:"blacktie",marks:"$$$$",name:"Black-tie",covers:"Landmark rooms · tasting menus · design florals"}
  ];
  var q=new URLSearchParams(location.search);
  var theme=(q.get("theme")||"A").toUpperCase();
  document.documentElement.setAttribute("data-theme",theme==="A"?"A":"A");

  function bandIndex(raw){
    if(raw==null||raw==="")return 1;
    var k=String(raw).toLowerCase().replace(/\s+/g,"");
    var map={
      budget:0,"$":0,"0":0,
      mid:1,"$$":1,"1":1,
      elevated:2,"$$$":2,"2":2,
      blacktie:3,"black-tie":3,"$$$$":3,"3":3
    };
    return Object.prototype.hasOwnProperty.call(map,k)?map[k]:1;
  }
  var current=bandIndex(q.get("band"));
  var list=document.getElementById("rungs");
  var live=document.getElementById("live");
  var buttons=[];

  function paint(){
    buttons.forEach(function(b,i){
      var on=i===current;
      b.classList.toggle("is-you",on);
      b.setAttribute("aria-pressed",on?"true":"false");
      b.setAttribute("aria-label",BANDS[i].name+", "+BANDS[i].covers+(on?", your band":""));
    });
    var b=BANDS[current];
    live.textContent="Your band is "+b.name+". "+b.covers;
  }

  BANDS.forEach(function(band,i){
    var btn=document.createElement("button");
    btn.type="button";
    btn.className="rung";
    btn.setAttribute("role","listitem");
    var marks=document.createElement("span");
    marks.className="marks";
    marks.textContent=band.marks;
    var copy=document.createElement("span");
    var name=document.createElement("span");
    name.className="band";
    name.textContent=band.name;
    var covers=document.createElement("span");
    covers.className="covers";
    covers.textContent=band.covers;
    copy.appendChild(name);
    copy.appendChild(covers);
    var you=document.createElement("span");
    you.className="you";
    you.textContent="You";
    btn.appendChild(marks);
    btn.appendChild(copy);
    btn.appendChild(you);
    btn.addEventListener("click",function(){current=i;paint();});
    list.appendChild(btn);
    buttons.push(btn);
  });
  paint();
})();
</script>
</body>
</html>
