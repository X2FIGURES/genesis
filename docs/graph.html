<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="refresh" content="0; url=tree.html">
<title>Life graph → Milestone journey</title>
<style>:root{--bg:#0f1115;--card:#161a22;--line:#242a36;--text:#eef0f5;--muted:#8d95a8;--yellow:#ffd166}*{box-sizing:border-box}html,body{height:100%;margin:0}body{display:grid;place-items:center;background:var(--bg);color:var(--text);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:24px}.card{max-width:420px;padding:20px 22px;border:1px solid var(--line);border-radius:16px;background:var(--card)}h1{font-size:20px;margin:0 0 8px}p{color:var(--muted);margin:0 0 14px}a{color:var(--yellow);font-weight:800}</style>
</head>
<body><main class="card"><h1>Life graph moved</h1><p>The milestone journey is opening. If it does not open automatically, use the link below.</p><a id="fallback" href="tree.html">Open the journey</a></main>
<script>
(function(){
  var current=new URL(location.href), query=current.searchParams, target=new URL('tree.html',current.href);
  var paths=['all','trading','build','learning','money','family'];
  query.forEach(function(value,key){
    if(key==='focus'){
      if(paths.indexOf(value)>=0) return;
      target.searchParams.set(key,value);
      return;
    }
    target.searchParams.set(key,value);
  });
  if(!target.searchParams.has('path')){
    var focus=query.get('focus');
    target.searchParams.set('path',paths.indexOf(focus)>=0?focus:'all');
  }
  var href=target.href;
  document.getElementById('fallback').href=href;
  location.replace(href);
}());
</script>
</body>
</html>
