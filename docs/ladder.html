<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lot Ladder</title>
<style>
:root{--bg:#0f1115;--card:#161a22;--line:#242a36;--text:#eef0f5;--muted:#8d95a8;
--blue:#4c8dff;--yellow:#ffd166;--green:#3ddc84;--red:#ff5c6c;--purple:#a78bfa}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
body{padding:10px}
.card{height:100%;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 12px 10px;display:flex;flex-direction:column;gap:10px;min-height:0}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.title{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.ex{font-size:11px;color:var(--muted)}
.grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(78px,1fr));gap:8px;align-content:center}
.rung{all:unset;box-sizing:border-box;cursor:pointer;position:relative;display:flex;flex-direction:column;gap:2px;justify-content:center;
background:#1b2029;border:1.5px solid #2a3140;border-radius:12px;padding:8px 8px 8px 10px;min-height:62px;
transition:transform .2s ease,border-color .2s ease,opacity .2s ease}
.rung:hover,.rung:focus-visible,.rung.sel{transform:translateY(-2px);border-color:#4a5368}
.rung:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.bal{font-size:clamp(17px,4.6vw,24px);font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.lot{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.tag{position:absolute;top:6px;right:7px;font-size:10px;font-weight:800;letter-spacing:.08em}
.done{border-color:rgba(61,220,132,.45)}
.done .bal{color:var(--green)}
.done .tag{color:var(--green);font-size:14px}
.now{border-color:var(--yellow);background:#221f14;box-shadow:0 0 14px rgba(255,209,102,.35);animation:pulse 2s ease-in-out infinite}
.now .bal{color:var(--yellow)}.now .lot{color:#e7cf99}
.now .tag{color:var(--yellow)}
.next{border-color:rgba(76,141,255,.7)}
.next .tag{color:var(--blue)}
.next .bal{color:var(--text)}
.lock{opacity:.4}
@keyframes pulse{0%,100%{box-shadow:0 0 8px rgba(255,209,102,.25)}50%{box-shadow:0 0 22px rgba(255,209,102,.65)}}
.detail{min-height:36px;display:flex;align-items:center;font-size:clamp(13px,3.4vw,16px);font-weight:600;line-height:1.3;border-top:1px solid var(--line);padding-top:8px}
.detail .y{color:var(--yellow)}.detail .b{color:var(--blue)}.detail .g{color:var(--green)}.detail .m{color:var(--muted)}
@media (prefers-reduced-motion:reduce){.now{animation:none}.rung{transition:none}}
</style>
</head>
<body>
<div class="card">
  <div class="top"><div class="title">Lot ladder</div><div class="ex" id="ex"></div></div>
  <div class="grid" id="grid" role="list"></div>
  <div class="detail" id="detail" aria-live="polite"></div>
</div>
<script>
(function(){
  function loadState(defaults){
    var q=new URLSearchParams(location.search),src=q.get('src')||'data/state.json';
    return fetch(src,{cache:'no-store'}).then(function(res){if(!res.ok)throw 0;return res.json();}).then(function(json){
      return {data:json,source:'state',updatedAt:json.updatedAt||null};
    }).catch(function(){return {data:defaults,source:'example',updatedAt:null};});
  }
  var EX_STR='15:0.01,25:0.01,40:0.02,65:0.03,100:0.05,160:0.08,250:0.12,400:0.20';
  function parsePairs(s){return s.split(',').map(function(p){var a=p.split(':');return{b:parseFloat(a[0]),l:(a[1]||'').trim()};})
    .filter(function(r){return isFinite(r.b)&&r.b>=0&&r.l!==''&&isFinite(parseFloat(r.l));});}
  function fromLadder(arr){return arr.map(function(row){return{b:row.balance,l:String(row.lot)};});}
  loadState({ladder:[]}).then(function(res){
    var q=new URLSearchParams(location.search),raw=q.get('rungs'),custom=false,rungs;
    if(raw){rungs=parsePairs(raw);if(rungs.length)custom=true;}
    if(!rungs||!rungs.length){
      if(res.source==='state'&&Array.isArray(res.data.ladder)&&res.data.ladder.length)rungs=fromLadder(res.data.ladder);
      else rungs=parsePairs(EX_STR);
    }
    rungs.sort(function(a,b){return a.b-b.b;});
    var acc=res.data.account||{},bv=parseFloat(q.get('balance')),balance;
    if(isFinite(bv))balance=bv;
    else if(acc.balance!=null&&isFinite(acc.balance))balance=acc.balance;
    else if(res.source==='state'&&typeof acc.start==='number')balance=acc.start;
    else balance=15;
    var ex=document.getElementById('ex');
    if(custom)ex.textContent='';
    else if(res.source==='state')ex.textContent=res.updatedAt?'state.json':'';
    else ex.textContent='example data';
    function fmt(n){var r=Math.round(n*100)/100;return '$'+(r%1===0?String(r):r.toFixed(2));}
    var cur=-1;rungs.forEach(function(r,i){if(balance>=r.b)cur=i;});
    var nxt=cur+1<rungs.length?cur+1:-1;
    var grid=document.getElementById('grid'),det=document.getElementById('detail'),els=[];
    function span(c,t){var s=document.createElement('span');s.className=c;s.textContent=t;return s;}
    function status(i){return i<cur?'done':i===cur?'now':i===nxt?'next':'lock';}
    function show(i){
      var r=rungs[i],st=status(i);det.textContent='';
      det.appendChild(span('m','Rung '+(i+1)+' of '+rungs.length+' \u00b7 '));
      det.appendChild(span('y',fmt(r.b)));det.appendChild(span('m',' \u2192 '));det.appendChild(span('y',r.l+' lot'));
      var tail=st==='done'?' \u00b7 completed':st==='now'?' \u00b7 you are here':fmt(r.b-balance)+' to unlock';
      if(st==='next'||st==='lock'){det.appendChild(span('m',' \u00b7 '));det.appendChild(span(st==='next'?'b':'m',tail));}
      else det.appendChild(span(st==='done'?'g':'y',tail));
      els.forEach(function(e,j){e.classList.toggle('sel',j===i);});
    }
    rungs.forEach(function(r,i){
      var st=status(i);
      var b=document.createElement('button');b.type='button';b.setAttribute('role','listitem');
      b.className='rung '+st;
      b.setAttribute('aria-label',fmt(r.b)+', '+r.l+' lot, '+(st==='done'?'completed':st==='now'?'current':st==='next'?'next':'locked'));
      b.appendChild(span('bal',fmt(r.b)));b.appendChild(span('lot',r.l+' lot'));
      b.appendChild(span('tag',st==='done'?'\u2713':st==='now'?'NOW':st==='next'?'NEXT':''));
      b.addEventListener('mouseenter',function(){show(i);});
      b.addEventListener('focus',function(){show(i);});
      b.addEventListener('click',function(){show(i);});
      grid.appendChild(b);els.push(b);
    });
    grid.addEventListener('mouseleave',function(){show(cur>=0?cur:(nxt>=0?nxt:0));});
    if(rungs.length)show(cur>=0?cur:(nxt>=0?nxt:0));
  });
})();
</script>
</body>
</html>
